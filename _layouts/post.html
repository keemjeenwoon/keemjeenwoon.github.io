---
layout: default
---

<div class="post-wrap">

  <div class="post-meta">
    <span class="post-tag">{{ page.category_label }}</span>
    <span class="post-sep">·</span>
    <span class="post-date">{{ page.date | date: "%Y. %m. %d" }}</span>
  </div>

  {% if page.image %}
  <div class="post-hero">
    <img src="{{ page.image | relative_url }}" alt="{{ page.title }}">
  </div>
  {% endif %}

  <h1 class="post-title">{{ page.title }}</h1>

  <div class="post-body">
    {{ content }}
  </div>

</div>
