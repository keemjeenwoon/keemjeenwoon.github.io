---
layout: default
---

{% assign posts = site.posts | where: "category", page.category %}

<main>

  <div class="cat-list">
    {% for post in posts %}
    <a href="{{ post.url | relative_url }}" class="hero cat-row">
      <div class="hero-img">
        {% if post.image %}
          <img src="{{ post.image | relative_url }}" alt="{{ post.title }}">
        {% endif %}
      </div>
      <div class="hero-text">
        <div class="tag">{{ post.category_label }}</div>
        <h2 class="hero-title">{{ post.title }}</h2>
        <p class="hero-excerpt">{{ post.excerpt | strip_html | truncatewords: 40 }}</p>
        <div class="meta">{{ post.date | date: "%Y. %m. %d" }}</div>
      </div>
    </a>
    {% endfor %}
  </div>

</main>
