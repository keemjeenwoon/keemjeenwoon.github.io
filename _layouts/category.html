---
layout: default
---

{% assign posts = site.posts | where: "category", page.category %}

<main>

  <div class="cat-list">
    {% for post in posts %}
    <div class="cat-row">
      <a href="{{ post.url | relative_url }}" class="hero-img{% if page.category == 'interview' %} hero-img--contain{% endif %}">
        {% if post.image %}
          <img src="{{ post.image | relative_url }}" alt="{{ post.title }}">
        {% endif %}
        <div class="hero-overlay">
          <div class="hero-meta-top">
            <span class="meta">{{ post.date | date: "%Y. %m. %d" }}</span>
          </div>
          <h2 class="hero-title">{{ post.title }}</h2>
          <p class="hero-excerpt">{{ post.excerpt | strip_html | truncatewords: 40 }}</p>
        </div>
      </a>
    </div>
    {% endfor %}
  </div>

</main>
