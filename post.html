<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>글 제목 — 삼삼오오</title>
  <style>
    @font-face {
      font-family: 'KoPubWorldDotum';
      src: url('fonts/KoPubWorld_Dotum_Bold.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'KoPubWorldDotum';
      src: url('fonts/KoPubWorld_Dotum_Light.woff2') format('woff2');
      font-weight: 300;
      font-style: normal;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --font: 'KoPubWorldDotum', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      --color-bg: #ffffff;
      --color-text: #111111;
      --color-muted: #888888;
      --color-faint: #bbbbbb;
      --color-border: #e0e0e0;
      --letter-spacing: -0.05em;
      --body-width: 640px;
    }

    body {
      font-family: var(--font);
      font-weight: 700;
      letter-spacing: var(--letter-spacing);
      background: var(--color-bg);
      color: var(--color-text);
      font-size: 14px;
      line-height: 1.5;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* ── HEADER ── */
    header {
      padding: .5rem 1.25rem 0;
      border-bottom: 1px solid var(--color-border);
    }

    .logo {
      margin-bottom: .5rem;
      display: inline-block;
    }

    .logo img {
      height: 24px;
      display: block;
    }

    .logo-text {
      font-size: 20px;
      letter-spacing: var(--letter-spacing);
    }

    nav {
      display: flex;
      margin: 0 -1.25rem;
      padding: 0 1.25rem;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    nav::-webkit-scrollbar { display: none; }

    nav a {
      font-size: 11px;
      padding: 5px 9px;
      color: var(--color-muted);
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
    }

    nav a.active,
    nav a:hover {
      color: var(--color-text);
      border-bottom-color: var(--color-text);
    }

    nav a.nav-all img { height: 14px; display: block; }
    nav a.nav-all .nav-all-text { font-size: 11px; }

    /* ── POST LAYOUT ── */
    .post-wrap {
      max-width: var(--body-width);
      margin: 0 auto;
      padding: 1.25rem 1.25rem 2rem;
    }

    /* 히어로 이미지 */
    .post-hero {
      width: 100%;
      aspect-ratio: 16 / 7;
      overflow: hidden;
      border-radius: 3px;
      background: #f0f0f0;
      margin-bottom: .75rem;
    }

    .post-hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 메타 */
    .post-meta {
      display: flex;
      align-items: center;
      gap: .5rem;
      margin-bottom: .4rem;
    }

    .post-tag {
      font-size: 10px;
      color: var(--color-muted);
    }

    .post-date {
      font-size: 10px;
      color: var(--color-faint);
      font-weight: 300;
    }

    .post-sep {
      font-size: 10px;
      color: var(--color-faint);
    }

    /* 제목 */
    .post-title {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: var(--letter-spacing);
      margin-bottom: .75rem;
    }

    /* 본문 */
    .post-body {
      font-size: 15px;
      font-weight: 300;
      line-height: 1.85;
      letter-spacing: var(--letter-spacing);
      color: var(--color-text);
    }

    .post-body p {
      margin-bottom: 1.25em;
    }

    .post-body p:last-child {
      margin-bottom: 0;
    }

    /* ── FOOTER ── */
    footer {
      padding: .45rem 1.25rem;
      border-top: 1px solid var(--color-border);
      text-align: center;
    }

    footer span {
      font-size: 10px;
      font-weight: 300;
      color: var(--color-faint);
    }

    footer a {
      color: var(--color-faint);
    }

    footer a:hover {
      color: var(--color-text);
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 480px) {
      .post-title { font-size: 18px; }
      .post-body { font-size: 14px; }
    }
  </style>
</head>
<body>

  <header>
    <a href="/" class="logo">
      <!-- 로고 이미지 준비 시: <img src="assets/logo.png" alt="삼삼오오"> -->
      <span class="logo-text">삼삼오오</span>
    </a>
    <nav>
      <a href="/" class="nav-all">
        <!-- <img src="assets/nav-all.png" alt="전체"> -->
        <span class="nav-all-text">전체</span>
      </a>
      <a href="/essay">에세이</a>
      <a href="/interview">인터뷰</a>
      <a href="/literature">문학</a>
      <a href="/film" class="active">영화</a>
      <a href="/place">장소</a>
    </nav>
  </header>

  <div class="post-wrap">

    <!-- 히어로 이미지 -->
    <div class="post-hero">
      <img src="assets/hero.jpg" alt="">
    </div>

    <!-- 메타 -->
    <div class="post-meta">
      <span class="post-tag">영화</span>
      <span class="post-sep">·</span>
      <span class="post-date">2026. 03. 12</span>
    </div>

    <!-- 제목 -->
    <h1 class="post-title">기억은 편집된다—카를리토의 길에 대하여</h1>

    <!-- 본문 -->
    <div class="post-body">
      <p>브라이언 드 팔마는 회상을 재료로 삼는다. 이미 끝난 이야기를 처음부터 들려준다는 것, 그 형식이 곧 비극의 구조다.</p>
      <p>본문 텍스트를 여기에 입력하세요.</p>
    </div>

  </div>

  <footer>
    <span>contact : <a href="mailto:kmjnwon@gmail.com">kmjnwon@gmail.com</a></span>
  </footer>

</body>
</html>
