<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3355</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
        font-family: 'Arial Unicode MS', Arial, sans-serif;
        font-size: 16pt;
        max-width: 390px;
        margin: 0px;
        padding: 0 10px;
        background: #ffffff;
        color: #000000;
        line-height: 1.6;
        }

        @media (min-width: 768px) {
            body {
                max-width: 390px;
                margin: 0px 0px 0px calc((100vw - 720px) / 2 + 10px);
            }
        }
        
        /* 헤더 */
        .header {
            text-align: center;
            padding: 10px 0 5px;
            border-bottom: 2px solid #000;
            margin-bottom: 20px;
        }
        
        .header img {
            max-width: 150px;
            height: auto;
        }
        
        /* 글 목록 */
        .post-list {
            list-style: none;
        }
        
        .post-item {
            display: flex;
            gap: 15px;
            padding: 20px 0;
            border-bottom: 1px solid #e0e0e0;
            text-decoration: none;
            color: inherit;
        }
        
        .post-item:hover {
            background: #fafafa;
        }
        
        .post-content {
            flex: 1;
        }
        
        .post-title {
            font-size: 16pt;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 8px;
        }
        
        .post-excerpt {
            font-size: 13pt;
            color: #666;
            line-height: 1.5;
        }
        
        .post-thumbnail {
            width: 100px;
            height: 100px;
            object-fit: cover;
            flex-shrink: 0;
        }
        
        @media (max-width: 768px) {
            .post-thumbnail {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>
<body>
    <!-- 헤더 -->
    <div class="header">
        <img src="/assets/images/3355-logo.png" alt="3355">
    </div>
    
    <!-- 글 목록 -->
    <ul class="post-list">
        {% for post in site.posts %}
        <a href="{{ post.url }}" class="post-item">
            <div class="post-content">
                <div class="post-title">{{ post.title }}</div>
                <div class="post-excerpt">{{ post.excerpt | strip_html | truncatewords: 20 }}</div>
            </div>
            {% if post.thumbnail %}
            <img src="{{ post.thumbnail }}" alt="" class="post-thumbnail">
            {% endif %}
        </a>
        {% endfor %}
    </ul>
</body>
</html>
