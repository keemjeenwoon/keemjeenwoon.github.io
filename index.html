<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삼삼오오</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial Unicode MS', Arial, sans-serif;
            font-size: 16pt;
            max-width: 390px;
            margin: 0px;
            padding: 0 10px;
            background: #ffffff;
            color: #000000;
            line-height: 1.6;
        }
        
        @media (min-width: 768px) {
            body {
                max-width: 390px;
                margin: 0px 0px 0px calc((100vw - 720px) / 2 + 10px);
            }
        }
        
        .header {
            text-align: center;
            padding: 10px 0 5px;
            margin-bottom: 0;
        }

        .header-line {
            border: none;
            border-top: 2px solid #000;
            margin: 8px 0 20px 0;
        }
        
        .post-list {
            list-style: none;
        }
        
        .post-item {
            display: flex;
            gap: 15px;
            padding: 12px 0;
            border-bottom: 1px solid #e0e0e0;
            text-decoration: none;
            color: inherit;
        }
        
        .post-item:hover {
            background: #fafafa;
        }
        
        .post-content {
            flex: 1;
        }
        
        .post-title {
            font-size: 16pt;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 6px;
        }
        
        .post-excerpt {
            font-size: 13pt;
            color: #444;
            line-height: 1.5;
        }
        
        .post-thumbnail {
            width: 70px;
            height: 70px;
            object-fit: cover;
            flex-shrink: 0;
        }
        
        @media (max-width: 768px) {
            .post-thumbnail {
                width: 60px;
                height: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <span style="font-size: 20pt; font-weight: 900; letter-spacing: -0.5px;">3355</span>
    </div>
    <hr class="header-line">
    
    <ul class="post-list">
        {% for post in site.posts %}
        <li>
            <a href="{{ post.url }}" class="post-item">
                <div class="post-content">
                    <div class="post-title">{{ post.title }}</div>
                    <div class="post-excerpt">{{ post.excerpt }}</div>
                </div>
                {% if post.thumbnail %}
                <img src="{{ post.thumbnail }}" alt="" class="post-thumbnail">
                {% endif %}
            </a>
        </li>
        {% endfor %}
    </ul>
</body>
</html>
